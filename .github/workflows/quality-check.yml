name: Prototype quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check prototype JavaScript and feature wiring
        run: node scripts/check-prototype.mjs
      - name: Compile Arc smart contract
        run: npx --yes solc@0.8.24 --bin contracts/ReinosChronicle.sol -o /tmp/reinos-contract-build
